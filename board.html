<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Winter race</title>
<style>
  :root{
    --bg:#191919; --card:#202020; --line:#2f2f2f; --text:#ececec; --muted:#9b9b9b; --dim:#5f5f5f;
    --gold:#f5c451; --track:#2b2b2b; --ok:#a6e3b4; --neg:#ff8b8f;
    --zone:#2a2618; --zone-line:#5a4a1e; --chip:#262626; --chip-on:#ececec; --chip-on-t:#191919;
    --snow:#ffffff; --snow-op:.25; --pro:#c9b6ff; --am:#9fd4ff;
  }
  html[data-theme="light"]{
    --bg:#ffffff; --card:#f7f7f5; --line:#e9e9e7; --text:#37352f; --muted:#787774; --dim:#b4b4b0;
    --gold:#b07d00; --track:#e3e2de; --ok:#448361; --neg:#d44c47;
    --zone:#fbf3db; --zone-line:#ecd9a4; --chip:#ffffff; --chip-on:#37352f; --chip-on-t:#ffffff;
    --snow:#9fc3e0; --snow-op:.45; --pro:#6940a5; --am:#2f76b5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:18px 18px 14px;position:relative;z-index:1}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .title img{height:40px;width:auto;display:block}
  .title .t{display:flex;flex-direction:column}
  .title small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
  .top-r{display:flex;align-items:center;gap:8px}
  .badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .theme-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;
    padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit;line-height:1.4}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
  .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:3px 11px;
    font-size:12.5px;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--chip-on);color:var(--chip-on-t);border-color:var(--chip-on)}
  .tw{overflow-x:auto;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  th.l,td.l{text-align:left}
  td.pl{font-weight:800;width:42px}
  td.nk{font-weight:600}
  td.tot{font-weight:800;font-size:15px}
  tr.zone td{background:var(--zone)}
  tr.zone td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
  tr.out td{color:var(--dim)}
  .st{font-size:11px;font-weight:700}
  .st.PRO{color:var(--pro)} .st.Amateur{color:var(--am)}
  .prize{font-size:11px;color:var(--gold);font-weight:700;margin-left:6px}
  .ok{color:var(--ok);font-weight:700}
  .neg{color:var(--neg)}
  .foot{margin-top:12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .empty{padding:40px 10px;text-align:center;color:var(--muted)}
  .snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .snow i{position:absolute;top:-10px;border-radius:50%;background:var(--snow);opacity:var(--snow-op);animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh)}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="wrap" id="app"><div class="empty">Загрузка…</div></div>
<script>
(function(){
  // ---------- правила марафона (те же, что в виджете модели) ----------
  var RULES = { PRO:{rate:2, norm:50, cap:100}, Amateur:{rate:3, norm:35, cap:70} };
  var THRESHOLD = 700, PRIZES = ["$500","$400","$300","$200","$100"];
  var EXTRAS = [
    {k:"ny",each:15,once:true},{k:"xm",each:15,once:true},{k:"room",each:20,once:true},
    {k:"tip",each:5,max:50},{k:"p30",each:3},{k:"p60",each:7},{k:"fan",each:2,max:40},{k:"hc",each:5,max:25}
  ];
  function moneyPts(ob){ ob=Math.max(0,ob||0); return Math.min(ob,1000)*0.15 + Math.max(ob-1000,0)*0.07; }
  function hourPts(h,cat,normOverride,final){
    var r=RULES[cat]||RULES.Amateur, norm=(normOverride!=null)?normOverride:r.norm;
    h=Math.max(0,h||0);
    var plus=Math.min(h,r.cap)*r.rate, minus=final?Math.max(norm-h,0)*r.rate:0;
    return plus-minus;
  }
  function extraPts(x){
    x=x||{}; var t=0;
    EXTRAS.forEach(function(e){ var n=+x[e.k]||0; var p=e.once?(n>0?e.each:0):n*e.each; if(e.max!=null)p=Math.min(p,e.max); t+=p; });
    return t;
  }
  function f0(n){ return (Math.round(n*10)/10).toLocaleString("ru-RU"); }
  function hrs(n){ return (Math.round((n||0)*10)/10).toLocaleString("ru-RU"); }
  function fmtDate(s){ if(!s) return ""; var p=s.split("-"); return p[2]+"."+p[1]; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  // ---------- тема ----------
  function getTheme(){
    try{ var t=localStorage.getItem("wr-theme"); if(t==="light"||t==="dark") return t; }catch(e){}
    return (window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
  }
  var THEME=getTheme();
  function applyTheme(){ document.documentElement.setAttribute("data-theme",THEME); }
  function themeLabel(){ return THEME==="light"?"🌙 тёмная":"☀️ светлая"; }
  applyTheme();

  // ---------- расшифровка ников ----------
  function b64(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
  function getKey(){
    var q=new URLSearchParams(location.search).get("k");
    if(!q){ var h=new URLSearchParams(location.hash.slice(1)); q=h.get("k"); }
    return q;
  }
  function decryptNames(enc, k){
    return crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"])
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(enc.iv)}, key, b64(enc.ct)); })
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }

  var STATE={coach:"Все", rows:[], updated:null};

  function build(data, names){
    var rows=[];
    Object.keys(names).forEach(function(code){
      var nm=names[code], m=(data.m||{})[code]||{p:[],x:{}};
      var total=0, h=0, stage=nm.s;
      (m.p||[]).forEach(function(p){
        if(!p) return;
        total += hourPts(p.h,p.cat,p.norm,p.st==="final") + moneyPts(p.ob);
        h += (p.h||0); if(p.cat) stage=p.cat;
      });
      var ex=extraPts(m.x); total+=ex;
      rows.push({n:nm.n, c:nm.c, s:stage, t:total, h:h, ex:ex, out:!!m.out});
    });
    rows.sort(function(a,b){ if(a.out!==b.out) return a.out?1:-1; return (b.t-a.t)||(b.h-a.h)||a.n.localeCompare(b.n); });
    var place=0; rows.forEach(function(r){ r.place = r.out ? null : ++place; });
    return rows;
  }

      if(STATE.coach!=="Все" && r.c!==STATE.coach) return;
      var zone = r.place && r.place<=5;
      var left = Math.max(0, THRESHOLD - r.t);
      h+='<tr class="'+(zone?'zone':'')+(r.out?' out':'')+'">'
        +'<td class="l pl">'+(r.place||'—')+'</td>'
        +'<td class="l nk">'+esc(r.n)+(zone?'<span class="prize">'+PRIZES[r.place-1]+'</span>':'')+(r.out?' · выбыла':'')+'</td>'
        +'<td class="l"><span class="st '+esc(r.s)+'">'+esc(r.s)+'</span></td>'
        +'<td class="l">'+esc(r.c)+'</td>'
        +'<td>'+hrs(r.h)+'</td>'
        +'<td>'+f0(r.ex)+'</td>'
        +'<td class="tot'+(r.t<0?' neg':'')+'">'+f0(r.t)+'</td>'
        +'<td>'+(left===0?'<span class="ok">✓</span>':f0(left))+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
    h+='<div class="foot"><span>Выделены места 1–5 (призовая зона). При равных баллах выше та, у кого больше часов. Меньше 700 баллов — половина приза.</span>'
      +'<span>Обновляется по понедельникам</span></div>';
    app.innerHTML=h;
  }

  document.addEventListener("click", function(e){
    var t=e.target; if(!t) return;
    if(t.id==="themeBtn"){ THEME=THEME==="light"?"dark":"light"; try{localStorage.setItem("wr-theme",THEME);}catch(err){} applyTheme(); t.textContent=themeLabel(); return; }
    var c=t.getAttribute&&t.getAttribute("data-coach"); if(c){ STATE.coach=c; render(); }
  });

  (function snow(){
    var s=document.getElementById("snow");
    for(var i=0;i<26;i++){ var d=document.createElement("i"); d.style.left=(Math.random()*100)+"%";
      d.style.animationDuration=(8+Math.random()*10)+"s"; d.style.animationDelay=(-Math.random()*15)+"s";
      var sz=2+Math.random()*3; d.style.width=d.style.height=sz+"px"; s.appendChild(d); }
  })();

  var app=document.getElementById("app"), k=getKey();
  if(!k){ app.innerHTML='<div class="empty">Нет доступа.</div>'; return; }
  var bust="?v="+Date.now();
  Promise.all([
    fetch("data.json"+bust,{cache:"no-store"}).then(function(r){return r.json();}),
    fetch("names.enc.json"+bust,{cache:"no-store"}).then(function(r){return r.json();})
  ]).then(function(res){
    STATE.updated=res[0].updated;
    return decryptNames(res[1], k).then(function(names){ STATE.rows=build(res[0], names); render(); });
  }).catch(function(){ app.innerHTML='<div class="empty">Нет доступа или данные не загрузились.</div>'; });
})();
</script>
</body>
</html>
