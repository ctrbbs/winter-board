<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Winter race</title>
<style>
  :root{
    --bg:#191919; --card:#202020; --line:#2f2f2f; --text:#ececec; --muted:#9b9b9b; --dim:#5f5f5f;
    --red:#e5484d; --green:#46a758; --gold:#f5c451; --ice:#9fd4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:18px 18px 14px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .title{font-size:18px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .title img{height:40px;width:auto;display:block}
  .title .t{display:flex;flex-direction:column}
  .title small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
  .badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin-top:14px}
  @media (max-width:720px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .big{font-size:40px;font-weight:800;line-height:1.05;margin:4px 0 2px}
  .big span{font-size:15px;font-weight:500;color:var(--muted);margin-left:6px}
  .bar{height:10px;border-radius:999px;background:#2b2b2b;overflow:hidden;margin:10px 0 6px;position:relative}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--red),var(--gold),var(--green))}
  .note{font-size:12.5px;color:var(--muted)}
  .note b{color:var(--text)}
  .hours{display:flex;align-items:baseline;gap:8px;margin-top:4px}
  .hours .v{font-size:30px;font-weight:800}
  .hours .n{color:var(--muted)}
  .warn{margin-top:8px;font-size:13px;color:#ffb3b5}
  .ok{margin-top:8px;font-size:13px;color:#a6e3b4}
  .row2{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
  .row2 div{min-width:110px}
  .row2 .k{font-size:12px;color:var(--muted)} .row2 .x{font-size:17px;font-weight:700}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
  th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  th:first-child,td:first-child{text-align:left}
  tr.future td{color:var(--dim)}
  tr.now td:first-child{color:var(--gold);font-weight:700}
  td.tot{font-weight:800}
  .neg{color:#ff8b8f} .pos{color:var(--text)}
  .tag{font-size:10.5px;padding:1px 6px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .tag.pre{background:#3a3220;color:var(--gold)} .tag.fin{background:#1f3324;color:#a6e3b4}
  .extras{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;margin-top:8px}
  .ex{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#1c1c1c}
  .ex .nm{font-size:13px}
  .ex .nm small{display:block;color:var(--muted);font-size:11.5px}
  .ex .pt{font-weight:800;font-variant-numeric:tabular-nums}
  .ex.done{border-color:#2f5a3a;background:#1b261e}
  .ex.done .pt{color:#a6e3b4}
  .foot{margin-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .empty{padding:40px 10px;text-align:center;color:var(--muted)}
  .snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .snow i{position:absolute;top:-10px;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.25;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh)}}
  .wrap{position:relative;z-index:1}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="wrap" id="app"><div class="empty">Загрузка…</div></div>

<script>
(function(){
  // ---------- правила марафона ----------
  var PERIODS = ["16–30 ноября","1–15 декабря","16–31 декабря","1–15 января"];
  var RULES = {
    PRO:     {rate:2, norm:50, cap:100},
    Amateur: {rate:3, norm:35, cap:70}
  };
  var THRESHOLD = 700;
  var EXTRAS = [
    {k:"ny",   name:"Новогодний аутфит",          each:15, once:true},
    {k:"xm",   name:"Рождественский аутфит",      each:15, once:true},
    {k:"room", name:"Новогодняя комната",          each:20, once:true},
    {k:"tip",  name:"Сингл-тип от 1000 токенов",   each:5,  max:50},
    {k:"p30",  name:"Приват от 30 минут",          each:3},
    {k:"p60",  name:"Приват от 1 часа",            each:7},
    {k:"fan",  name:"Подписчик фанклуба",          each:2,  max:40}
  ];

  function moneyPts(ob){ ob = Math.max(0, ob||0); return Math.min(ob,1000)*0.15 + Math.max(ob-1000,0)*0.07; }
  function hourPts(h, cat, normOverride, final){
    var r = RULES[cat] || RULES.Amateur;
    var norm = (normOverride!=null) ? normOverride : r.norm;
    h = Math.max(0, h||0);
    var plus = Math.min(h, r.cap) * r.rate;
    var short = Math.max(norm - h, 0);
    var minus = final ? short * r.rate : 0;   // штраф только по итогам периода
    return {plus:plus, minus:minus, net:plus-minus, short:short, norm:norm, rate:r.rate};
  }
  function extraPts(x){
    x = x||{}; var total=0, list=[];
    EXTRAS.forEach(function(e){
      var n = +x[e.k]||0;
      var p = e.once ? (n>0 ? e.each : 0) : n*e.each;
      if (e.max!=null) p = Math.min(p, e.max);
      total += p; list.push({e:e, n:n, p:p});
    });
    return {total:total, list:list};
  }
  function f0(n){ return (Math.round(n*10)/10).toLocaleString("ru-RU"); }
  function usd(n){ return "$" + Math.round(n||0).toLocaleString("ru-RU"); }
  function hrs(n){ return (Math.round((n||0)*10)/10).toLocaleString("ru-RU") + " ч"; }
  function fmtDate(s){ if(!s) return ""; var p=s.split("-"); return p[2]+"."+p[1]; }

  function render(data, id){
    var app = document.getElementById("app");
    var m = data && data.m && data.m[id];
    if (!m){
      app.innerHTML = '<div class="empty">Страница не найдена. Проверь ссылку у своего коуча.</div>'; return;
    }
    if (m.out){
      app.innerHTML = '<div class="empty">Участие в марафоне завершено.</div>'; return;
    }
    var cur = data.current||0;
    var rows = [], total = 0, totalHours = 0;
    for (var i=0;i<4;i++){
      var p = (m.p||[])[i];
      if (!p){ rows.push({i:i, empty:true}); continue; }
      var final = p.st === "final";
      var hp = hourPts(p.h, p.cat, p.norm, final);
      var mp = moneyPts(p.ob);
      var t = hp.net + mp;
      total += t; totalHours += (p.h||0);
      rows.push({i:i, p:p, hp:hp, mp:mp, t:t, final:final});
    }

    total += ex.total;

       + '<div class="row2"><div><div class="k">часы и деньги</div><div class="x">'+f0(total-ex.total)+'</div></div>'
       + '<div><div class="k">допбаллы</div><div class="x">'+f0(ex.total)+'</div></div>'
       + '<div><div class="k">часов за марафон</div><div class="x">'+hrs(totalHours)+'</div></div></div>'
       + '</div>';

    // текущий период
    h += '<div class="card"><div class="label">Сейчас: '+PERIODS[cur]+'</div>';
    if (cr){
      h += '<div class="hours"><span class="v">'+hrs(cr.p.h)+'</span><span class="n">/ '+f0(cr.hp.norm)+' ч</span></div>';
      if (cr.hp.short>0 && !cr.final){
        h += '<div class="warn">Осталось <b>'+f0(cr.hp.short)+' ч</b>. Если к концу периода их не будет — минус '
           + f0(cr.hp.short*cr.hp.rate)+' баллов.</div>';
      } else if (cr.hp.short>0 && cr.final){
        h += '<div class="warn">Норма не добрана на '+f0(cr.hp.short)+' ч — минус '+f0(cr.hp.minus)+' баллов.</div>';
      } else {
        h += '<div class="ok">Норма часов выполнена 🎉 Каждый час сверху — ещё +'+cr.hp.rate+' балла.</div>';
      }
      h += '<div class="row2"><div><div class="k">оборот</div><div class="x">'+usd(cr.p.ob)+'</div></div>'
         + '<div><div class="k">баллы за период</div><div class="x">'+f0(cr.t)+'</div></div></div>';
      h += '<div class="note" style="margin-top:8px">'+(cr.final?'Итог периода.':'Предварительно, на '+fmtDate(data.updated)+'. Точные цифры — после зарплаты.')+'</div>';
    } else {
      h += '<div class="note" style="margin-top:8px">Цифры по этому периоду появятся в понедельник.</div>';
    }
    h += '</div></div>';

    // таблица периодов
    h += '<div class="card" style="margin-top:12px"><div class="label">По периодам</div><div style="overflow-x:auto"><table><thead><tr>'
       + '<th>Период</th><th>Часы</th><th>Оборот</th><th>За часы</th><th>За оборот</th><th>Итого</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var cls = r.i===cur ? 'now' : (r.i>cur ? 'future' : '');
      if (r.empty){
        h += '<tr class="'+(r.i>cur?'future':cls)+'"><td>'+PERIODS[r.i]+'</td><td>—</td><td>—</td><td>—</td><td>—</td><td class="tot">—</td></tr>';
        return;
      }
      h += '<tr class="'+cls+'"><td>'+PERIODS[r.i]+'<span class="tag '+(r.final?'fin':'pre')+'">'+(r.final?'итог':'предв.')+'</span></td>'
         + '<td>'+hrs(r.p.h)+'</td><td>'+usd(r.p.ob)+'</td>'
         + '<td class="'+(r.hp.net<0?'neg':'pos')+'">'+(r.hp.net>0?'+':'')+f0(r.hp.net)+'</td>'
         + '<td>+'+f0(r.mp)+'</td><td class="tot">'+f0(r.t)+'</td></tr>';
    });
    h += '</tbody></table></div></div>';

    // допбаллы
    h += '<div class="card" style="margin-top:12px"><div class="label">Допбаллы — '+f0(ex.total)+'</div><div class="extras">';
    ex.list.forEach(function(it){
      var e = it.e, sub;
      if (e.once) sub = it.n>0 ? 'засчитано' : '+'+e.each+' баллов';
      else sub = it.n+' шт. · по '+e.each+(e.max!=null?' · макс '+e.max:'');
      h += '<div class="ex'+(it.p>0?' done':'')+'"><div class="nm">'+(it.p>0&&e.once?'✅ ':'')+e.name+'<small>'+sub+'</small></div>'
         + '<div class="pt">'+(it.p>0?'+'+it.p:'0')+'</div></div>';
    });
    h += '</div></div>';

    h += '<div class="foot"><span>Часы: +'+RULES.PRO.rate+'/+'+RULES.Amateur.rate+' за час, минус столько же за каждый час ниже нормы. Оборот: 15 баллов за каждые $100 до $1000, 7 — сверху.</span>'
       + '<span>Подтверждения допов — своему коучу</span></div>';

    app.innerHTML = h;
  }

  function snow(){
    var s = document.getElementById("snow"), n = 26;
    for (var i=0;i<n;i++){
      var d = document.createElement("i");
      d.style.left = (Math.random()*100)+"%";
      d.style.animationDuration = (8+Math.random()*10)+"s";
      d.style.animationDelay = (-Math.random()*15)+"s";
      var sz = 2+Math.random()*3; d.style.width=d.style.height=sz+"px";
      s.appendChild(d);
    }
  }

  var id = new URLSearchParams(location.search).get("id") || "";
  snow();
  if (window.__DATA__) { render(window.__DATA__, id || "demo"); return; }
  fetch("data.json?v=" + Date.now(), {cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(function(d){ render(d, id); })
    .catch(function(){ document.getElementById("app").innerHTML = '<div class="empty">Не удалось загрузить данные. Обнови страницу позже.</div>'; });
})();
</script>
</body>
</html>
